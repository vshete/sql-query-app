services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: query_app
      POSTGRES_USER: query_app
      POSTGRES_PASSWORD: query_app_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - query_app_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U query_app -d query_app"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  query_app_postgres:
